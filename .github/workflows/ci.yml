name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm types
      - run: pnpm test
      - run: pnpm unused

  release:
    name: Release
    needs: checks
    # Skipped on the template repo itself — a template has no consumers, so a
    # release would tag an artifact nobody fetches. Repos generated from it are
    # not templates, so they get releases with no setup step.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An open issue labelled `blocks-release` holds every release until it is
      # closed: a PRD implemented over fifteen commits is one version, not
      # fifteen, and the number it earns is decided by all of them together.
      # Closing the issue is what releases; nothing here needs editing.
      - name: Check for issues that block a release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          blocking=$(gh issue list --repo "$GITHUB_REPOSITORY" --label blocks-release --state open --json number --jq '[.[].number] | join(" ")')
          if [ -n "$blocking" ]; then
            echo "Release held by open issue(s): $blocking" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.blocking == ''

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.blocking == ''
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.blocking == ''

      - run: pnpm build
        if: steps.gate.outputs.blocking == ''

      - run: pnpm semantic-release
        if: steps.gate.outputs.blocking == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
